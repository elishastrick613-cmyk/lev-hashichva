const notice=document.createElement('section');notice.className='card';document.querySelector('header').after(notice);notice.innerHTML='<h2>כניסה ליומן כיתה ו׳2</h2><p>התחבר עם החשבון שלך ב״לב השכבה״.</p><form id="login" class="bar"><label>מייל<input id="email" type="email" autocomplete="username" required value="elishastrick613@gmail.com"></label><label>סיסמה<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">כניסה</button></form><p id="cloudMessage" role="status"></p>';document.querySelector('main').hidden=true;
const msg=text=>document.getElementById('cloudMessage').textContent=text;
document.getElementById('login').onsubmit=async e=>{e.preventDefault();msg('מתחבר…');try{await signInWithEmailAndPassword(auth,document.getElementById('email').value,document.getElementById('password').value);document.getElementById('password').value=''}catch(e){msg('הכניסה נכשלה. בדוק את המייל והסיסמה.')}};
const cacheSave=window.save;function persistPending(){try{localStorage.setItem('classV2-pending-'+auth.currentUser.uid,JSON.stringify([...pending]))}catch(e){msg('לא ניתן לשמור את תור השינויים במכשיר. השאר את הדף פתוח עד לסיום השמירה בענן.')}}
function fingerprint(record){return JSON.stringify(record)}
window.save=function(){cacheSave();if(!ready)return;for(const kind of ['lessons','grades'])for(const record of db[kind]){const key=kind+'/'+record.id,value=fingerprint(record);if(baseline.get(key)!==value)pending.set(key,{kind,record:JSON.parse(value),value})}persistPending();msg('שינויים ממתינים לשמירה בענן…');clearTimeout(timer);timer=setTimeout(flush,500)};
async function flush(){if(busy||!ready)return;busy=true;try{while(pending.size){const [key,item]=pending.entries().next().value;await setDoc(doc(firestore,'classV2',auth.currentUser.uid,item.kind,item.record.id),{record:item.record,updatedAt:serverTimestamp()});baseline.set(key,item.value);if(pending.get(key)===item)pending.delete(key);persistPending()}msg('✓ כל השיעורים והציונים נשמרו ב־Firebase');if(el('status'))el('status').textContent='✓ נשמר בענן'}catch(e){msg('השמירה בענן נכשלה; העותק המקומי נשמר. לחץ על ״ניסיון שמירה נוסף״.')}finally{busy=false}}
onAuthStateChanged(auth,async user=>{ready=false;document.querySelector('main').hidden=true;if(!user)return;if(user.email!=='elishastrick613@gmail.com'||!user.emailVerified){msg('הגישה מיועדת לחשבון המורה המאומת.');return}msg('טוען את השיעורים והציונים…');try{const results=await Promise.all(['lessons','grades'].map(kind=>getDocs(collection(firestore,'classV2',user.uid,kind))));db={lessons:results[0].docs.map(d=>d.data().record),grades:results[1].docs.map(d=>d.data().record)};for(const kind of ['lessons','grades']){db[kind].sort((a,b)=>a.date.localeCompare(b.date));for(const r of db[kind])baseline.set(kind+'/'+r.id,fingerprint(r))}try{pending=new Map(JSON.parse(localStorage.getItem('classV2-pending-'+user.uid)||'[]'));for(const item of pending.values()){const index=db[item.kind].findIndex(r=>r.id===item.record.id);if(index<0)db[item.kind].push(item.record);else db[item.kind][index]=item.record}}catch(e){pending=new Map()}current=grade=null;ready=true;cacheSave();render();document.querySelector('main').hidden=false;document.getElementById('login').hidden=true;notice.querySelector('h2').textContent='היומן שלך מחובר';notice.querySelector('p').textContent='שמירה אוטומטית ב־Firebase · כניסה מכל מכשיר';msg('✓ הנתונים נטענו מהענן');const retry=document.createElement('button');retry.textContent='ניסיון שמירה נוסף';retry.onclick=flush;notice.append(retry);const logout=document.createElement('button');logout.textContent='יציאה';logout.onclick=async()=>{if(pending.size||busy){msg('יש שינויים שטרם נשמרו בענן. נסה לשמור לפני יציאה.');return}await signOut(auth);location.reload()};notice.append(logout);if(pending.size)flush()}catch(e){msg('לא ניתן לטעון את הנתונים. רענן ונסה שוב.')}});

const originalRender=render;
render=function(){const y=window.scrollY,x=window.scrollX,positions=[...document.querySelectorAll('.scroll')].map(n=>n.scrollLeft);originalRender();document.querySelectorAll('table').forEach(t=>{const labels=[...t.querySelectorAll('tr:first-child th')].map(n=>n.textContent);t.querySelectorAll('tr').forEach(r=>r.querySelectorAll('td').forEach((c,i)=>c.dataset.label=labels[i]||''))});document.querySelectorAll('.scroll').forEach((n,i)=>n.scrollLeft=positions[i]||0);window.scrollTo(x,y)};
window.manualSave=async function(){if(!ready){msg('יש להתחבר לפני השמירה');return}window.save();clearTimeout(timer);document.querySelectorAll('.lesson-save-state').forEach(n=>n.textContent='שומר…');await flush();while(busy)await new Promise(resolve=>setTimeout(resolve,80));document.querySelectorAll('.lesson-save-state').forEach(n=>n.textContent=pending.size?'השמירה בענן נכשלה. נסה שוב.':'✓ השיעור נשמר בענן')};
render();
window.addEventListener('beforeunload',e=>{if(pending.size||busy){e.preventDefault();e.returnValue=''}});
</script></html>
